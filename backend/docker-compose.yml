services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sistema_tributario
      POSTGRES_PASSWORD: cambia_esta_clave
      POSTGRES_DB: sistema_tributario
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sistema_tributario"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://sistema_tributario:cambia_esta_clave@db:5432/sistema_tributario?schema=public"
    ports:
      - "3000:3000"

volumes:
  db_data:
