name: Disponibilidad del Sistema Tributario
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  issues: write
jobs:
  check:
    if: vars.MONITORING_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar HTTPS, interfaz, base de datos y acceso protegido
        env:
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL || 'https://declaraciones-nine.vercel.app' }}
        run: node backend/scripts/check-deployment.cjs
      - name: Registrar alerta de disponibilidad
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Alerta de disponibilidad del Sistema Tributario';
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', creator: 'github-actions[bot]'});
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({...context.repo, title, body: `Falló la comprobación de disponibilidad. Revisa la ejecución: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nNo compartas secretos ni datos tributarios en esta incidencia.`});
            }
