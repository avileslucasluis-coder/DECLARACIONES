name: Disponibilidad del Sistema Tributario
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
jobs:
  check:
    if: vars.MONITORING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar HTTPS, interfaz, base de datos y acceso protegido
        env:
          DEPLOYMENT_URL: ${{ vars.DEPLOYMENT_URL }}
        run: node backend/scripts/check-deployment.cjs
