name: Copia cifrada de PostgreSQL
on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  backup:
    if: vars.BACKUPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crear copia cifrada
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node backend/scripts/backup-encrypted.cjs backup.enc
      - name: Restaurar y verificar en PostgreSQL aislado
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node backend/scripts/verify-backup.cjs backup.enc
      - uses: actions/upload-artifact@v4
        with:
          name: database-${{ github.run_id }}
          path: backup.enc
          retention-days: 7
          if-no-files-found: error
