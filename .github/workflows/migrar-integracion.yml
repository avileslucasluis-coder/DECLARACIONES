name: Migrar integracion de declaraciones
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-backup
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias verificadas
        working-directory: backend
        run: npm ci --include=dev
      - name: Aplicar migraciones pendientes y verificar esquema
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          npm run prisma:generate
          npm run db:deploy
          npm run check:database
